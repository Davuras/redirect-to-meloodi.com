<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meloodi ist umgezogen! 🚀</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a24;
            --primary-color: #ff4b4b; /* Dein Meloodi-Rot/Pink */
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-placeholder {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .countdown-box {
            font-size: 0.9rem;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Kleiner Lade-Kringel */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 75, 75, 0.2);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 8px 20px rgba(255, 75, 75, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 75, 75, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-placeholder">🎵</div>
        <h1>Meloodi hat eine neue Adresse!</h1>
        <p>Wir haben unsere App auf einen eigenen, ultraschnellen Server umgezogen, um dir die beste Performance zu bieten.</p>
        
        <div class="countdown-box">
            <div class="spinner"></div>
            <span>Weiterleitung in <span id="countdown">5</span> Sekunden...</span>
        </div>

        <a href="https://www.meloodi.com" class="btn">Direkt zu meloodi.com</a>
    </div>

    <script>
        const targetUrl = "https://www.meloodi.com";
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');

        const interval = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>

</body>
</html>
